<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-label="Derin Kazi - side-view digging and upgrade loop in Godot 4, five layers down to the core at 250 m">
<defs>
  <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#17161d"/><stop offset="58%" stop-color="#0e0d12"/><stop offset="100%" stop-color="#0b0b0f"/>
  </linearGradient>
  <linearGradient id="name" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#f2efe6"/><stop offset="62%" stop-color="#e7dcc0"/><stop offset="100%" stop-color="#c9a961"/>
  </linearGradient>
  <linearGradient id="hair" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#c9a961" stop-opacity="0.5"/><stop offset="100%" stop-color="#c9a961" stop-opacity="0"/>
  </linearGradient>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect width="1200" height="250" fill="url(#bg)"/>

<text x="54" y="96" font-family="'Cascadia Code','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-weight="700" font-size="48" fill="url(#name)" letter-spacing="-1">Derin Kazı</text>
<text x="56" y="132" font-family="'Segoe UI',Verdana,Helvetica,sans-serif" font-size="17" fill="#c7c2b6" opacity="0.92">Dig, sell, upgrade, go deeper — with the fuel gauge as the real timer.</text>
<line x1="56" y1="152" x2="330" y2="152" stroke="url(#hair)" stroke-width="1.5"/>
<rect x="56" y="176" width="215" height="26" rx="13" fill="#141419" stroke="#4ade9e" stroke-opacity="0.45"/>
<text x="163" y="193" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" fill="#4ade9e">304 unit + 156 playthrough</text>
<rect x="281" y="176" width="91" height="26" rx="13" fill="#141419" stroke="#c9a961" stroke-opacity="0.45"/>
<text x="326" y="193" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" fill="#c9a961">Godot 4.7</text>
<rect x="382" y="176" width="120" height="26" rx="13" fill="#141419" stroke="#6cb6ff" stroke-opacity="0.45"/>
<text x="442" y="193" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" fill="#6cb6ff">core at 250 m</text>
<text x="756" y="74" font-family="'Cascadia Code','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13" fill="#4a4a55" text-anchor="end">loop</text>
<line x1="768" y1="60" x2="768" y2="82" stroke="#2a2a33"/>
<text x="782" y="74" font-family="'Cascadia Code','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13" fill="#6cb6ff">mine, haul, sell, upgrade</text>
<circle cx="700" cy="70" r="3" fill="#6cb6ff" filter="url(#glow)"/>
<text x="756" y="108" font-family="'Cascadia Code','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13" fill="#4a4a55" text-anchor="end">layers</text>
<line x1="768" y1="94" x2="768" y2="116" stroke="#2a2a33"/>
<text x="782" y="108" font-family="'Cascadia Code','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13" fill="#d7d75f">five, down to the core</text>
<circle cx="700" cy="104" r="3" fill="#d7d75f" filter="url(#glow)"/>
<text x="756" y="142" font-family="'Cascadia Code','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13" fill="#4a4a55" text-anchor="end">world</text>
<line x1="768" y1="128" x2="768" y2="150" stroke="#2a2a33"/>
<text x="782" y="142" font-family="'Cascadia Code','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13" fill="#4ade9e">built from a seed, daily</text>
<circle cx="700" cy="138" r="3" fill="#4ade9e" filter="url(#glow)"/>
<text x="756" y="176" font-family="'Cascadia Code','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13" fill="#4a4a55" text-anchor="end">export</text>
<line x1="768" y1="162" x2="768" y2="184" stroke="#2a2a33"/>
<text x="782" y="176" font-family="'Cascadia Code','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13" fill="#4ade9e">1,782,396 -&gt; 968,680 bytes</text>
<circle cx="700" cy="172" r="3" fill="#4ade9e" filter="url(#glow)"/>
</svg>
