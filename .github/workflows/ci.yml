name: CI

# Depo 21 Eylul 2026'da GitHub'a tasindi; o zamana kadar 304 birim + 156 oynanis kontrolu yalniz elle
# kosuyordu.
#
# Yeni test komutu UYDURULMUYOR: README.md "Testler" bolumunde yazan kapinin aynisi kosuluyor.
# Test betigi `quit(1 if hata > 0 else 0)` ile bitiyor -- cikis kodu 0 = gecti.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # project.godot: config/features = "4.7". Surum SABIT tutuluyor --
  # "latest" kullanmak, motor guncellenince testlerin bizden habersiz
  # kirmizi yanmasi demek olurdu.
  GODOT_SURUM: 4.7.2-stable
  # Test kapisinin tabanlari (toplam 477): bir paketin gecen sinama sayisi
  # kendi tabaninin altina duserse CI kirmizi. Test EKLEYINCE ilgili tabani
  # yukselt (README ile birlikte); dusurmek, bir bolumun sessizce
  # kayboldugunu kabul etmek demek.
  TEST_TABANI_BIRIM: 304
  TEST_TABANI_OYNANIS: 156
  TEST_TABANI_DENGE: 7
  TEST_TABANI_INSAN: 10
  # Fay kapisinin en az kac tohumda 12/12 demesi gerektigi.
  FAY_TOHUM_TABANI: 12

# Isletici imaji da ayni gerekceyle sabit: "ubuntu-latest" 19 Ekim 2026'dan
# itibaren Ubuntu 26'ya kayiyor (runner-images#14748). Motor surumunu sabit
# tutup altindaki isletim sistemini habersiz degistirmek ayni riski geri
# getirirdi. Eylem surumleri Node 24 calisma zamanli ana surumlerde
# (checkout@v7, upload-sarif@v4): v4/v3 her kosuda "Node.js 20 is deprecated"
# ve "CodeQL Action v3 will be deprecated in December 2026" uyarisi veriyordu.

jobs:
  testler:
    runs-on: ubuntu-24.04
    # Normal kosu ~1,5 dk. Bir sinama hic donmezse (takili bir await, sonsuz
    # dongu) 6 saatlik varsayilan yerine 15 dakikada kirmizi.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # PNG/WAV/TTF Git LFS'te (.gitattributes). LFS cekilmezse
          # checkout yalnizca ~130 baytlik isaretci dosyalari getirir ve
          # ice aktarma bozuk varlik uretir.
          lfs: true

      - name: Godot ${{ env.GODOT_SURUM }} indir
        run: |
          set -euo pipefail
          ad="Godot_v${GODOT_SURUM}_linux.x86_64"
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_SURUM}/${ad}.zip"
          unzip -q godot.zip
          chmod +x "$ad"
          sudo mv "$ad" /usr/local/bin/godot
          godot --version

      # Ice aktarma AYRI adim: taze checkout'ta .godot onbellegi hic yok,
      # eksik onbellek testin icerigiyle ilgisi olmayan ayristirma
      # hatalari uretiyor.
      - name: Projeyi ice aktar
        run: godot --headless --path . --import

      # Cikis kodu tek basina yetmiyor: bir test fonksiyonundaki calisma
      # zamani hatasi yalnizca o fonksiyonu keser, kalan sinamalar sayilmaz
      # ve paket yine "N sınama, 0 hata" ile 0 doner (25 Eylul 2026'da gercek
      # motorla denendi: _deprem_testleri'nde bir null erisimi -> "282 sınama,
      # 0 hata", cikis 0). tests/kapi.sh her paketin gunlugunu okuyup sonuc
      # satirini, tabani ve "SCRIPT ERROR" yoklugunu zorunlu kiliyor.
      - name: Birim testleri (en az ${{ env.TEST_TABANI_BIRIM }})
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/test_calistir.gd 2>&1 | tee "$RUNNER_TEMP/birim.log"
          bash tests/kapi.sh "$RUNNER_TEMP/birim.log" "$TEST_TABANI_BIRIM"

      - name: Oynanis testi (en az ${{ env.TEST_TABANI_OYNANIS }})
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/test_oynanis.gd 2>&1 | tee "$RUNNER_TEMP/oynanis.log"
          bash tests/kapi.sh "$RUNNER_TEMP/oynanis.log" "$TEST_TABANI_OYNANIS"

      # Bu uc paket "dakikalarca suren denge simulasyonlari" diye CI disinda
      # birakilmisti ve gelistirme turu basina bir kez YERELDE kosuluyordu.
      # 22 Eylul 2026'da olculdu: 0 sn, 1 sn ve 6 sn. Gerekce iki buyukluk
      # mertebesi yanlisti, ve bu arada deponun en yuklu iddialari --
      # "cekirdege 25 dakikada varilir", "fay acikken 12 tohumun 12'si",
      # "2-4 dakikalik turda bir gelistirme" -- hicbir otomatik kapinin
      # arkasinda degildi. Dunya ureticisinde bir degisiklik bunlari sessizce
      # bozabilirdi.
      - name: Denge simulasyonu (kusursuz bot, en az ${{ env.TEST_TABANI_DENGE }} sinama)
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/test_denge.gd 2>&1 | tee "$RUNNER_TEMP/denge.log"
          bash tests/kapi.sh "$RUNNER_TEMP/denge.log" "$TEST_TABANI_DENGE"

      - name: Insan benzeri olcum (en az ${{ env.TEST_TABANI_INSAN }} sinama)
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/test_insan.gd 2>&1 | tee "$RUNNER_TEMP/insan.log"
          bash tests/kapi.sh "$RUNNER_TEMP/insan.log" "$TEST_TABANI_INSAN"

      # Bu bir sayi degil bir kapi: fay acikken 12 tohumun 12'sinde bot
      # cekirdege varmali, varamazsa cikis 1.
      - name: Fay hatti - bot 12/12 cekirdege variyor mu
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/test_fay_olcum.gd 2>&1 | tee "$RUNNER_TEMP/fay.log"
          bash tests/kapi.sh --fay "$RUNNER_TEMP/fay.log" "$FAY_TOHUM_TABANI"

  referanslar:
    name: Kaynak referanslari saglam mi
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      # Test kapisinin kendi sinamasi: Godot gerektirmez, bu yuzden motoru
      # indirmeyen bu iste. Kapi bozulursa (ornegin SCRIPT ERROR aramasi
      # silinirse) burada kirmizi yanar.
      - name: Test kapisi sinamasi
        run: bash tests/kapi_sinama.sh

      # Kirik bir kaynak referansi motoru her zaman durdurmuyor: eksik bir
      # .tscn ya da silinmis bir .png, sahne o kod yolu calisana kadar
      # sessiz kalabiliyor -- yani testler yesilken de var olabiliyor.
      # Bu kontrol motoru indirmeden, ayni hesaptaki godot-refcheck ile
      # yapiliyor; su an temiz (177 dosya, 46 referans, sifir
      # bulgu) ve bu commit'ten sonra oyle kalmasi garanti.
      - name: godot-refcheck
        uses: Furkiozknn/godot-refcheck@b083e3d2998ca0d5101289b106c76794c6de866d  # v0.2.0 + the clean-project fix
        with:
          path: .
          fail-on: error
          sarif: refcheck.sarif

      - name: SARIF raporunu kod taramaya yukle
        if: always() && hashFiles('refcheck.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: refcheck.sarif
          category: godot-refcheck
